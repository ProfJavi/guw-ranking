  }

  .btn:disabled {

    margin-bottom: 15px;

    letter-spacing: 0.5px;

    margin-bottom: 15px;

  .submission-box.error {

  .leaderboard-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
  }

  .leaderboard-table th {
    background: #004943;
    color: #FFFFFF;

    letter-spacing: 0.5px;
    font-weight: 700;

  .leaderboard-table th:first-child {

  .leaderboard-table th:last-child {
    text-align: right;
  }

  .leaderboard-table td {

    font-size: 1rem;

  .leaderboard-table tr:hover {
    background: #F5F5F5;
  }

  .leaderboard-table .rank-1 {
    background: linear-gradient(90deg, #FFF8E1 0%, #FFECB3 100%);

  .leaderboard-table .rank-1 td:first-child { font-size: 1.5rem; }

  .leaderboard-table .rank-2 {
    background: linear-gradient(90deg, #F5F5F5 0%, #E8E8E8 100%);
    font-weight: 700;
  }

  .leaderboard-table .rank-2 td:first-child { font-size: 1.5rem; }

  .leaderboard-table .rank-3 {
    background: linear-gradient(90deg, #FBE9E7 0%, #FFCCBC 100%);
    font-weight: 700;
  }

  .leaderboard-table .rank-3 td:first-child { font-size: 1.5rem; }

  .leaderboard-table .rank-cell {
    text-align: center;
    font-weight: 700;
    font-size: 1.1rem;
    color: #004943;
  }

  .leaderboard-table .username-cell {
    color: #333;
    font-weight: 600;
  }

  .leaderboard-table .score-cell {
    text-align: right;
    font-weight: 700;
    color: #004943;
    font-size: 1.1rem;
  }

  .leaderboard-table .attempts-badge {
    display: inline-block;
    background: #F18625;
    color: #FFFFFF;
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: 8px;
    vertical-align: middle;
    font-weight: 700;
  }

  .leaderboard-loading, .leaderboard-error, .leaderboard-empty {
    text-align: center;
    padding: 40px 20px;
    color: #666;
    font-size: 1rem;
  }

  .leaderboard-error { color: #dc3545; }

  .closed-screen {
    padding: 20px;
  }

  .closed-screen .closed-icon {
    font-size: 4rem;
    margin-bottom: 20px;
  }

  .closed-screen .closed-title {
    color: #004943;
    font-size: 1.8rem;
    font-weight: 700;
    margin-bottom: 15px;
  }

  .closed-screen .closed-message {
    color: #666;
    font-size: 1.05rem;
    line-height: 1.6;
    max-width: 600px;
    margin: 0 auto 25px auto;
  }

  .closed-screen .closed-badge {
    display: inline-block;
    background: #fee2e2;
    color: #7f1d1d;
    padding: 10px 20px;
    border-radius: 50px;
    font-weight: 700;
    font-size: 0.9rem;
    margin-bottom: 25px;
  }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(30px); }
    to { opacity: 1; transform: translateX(0); }
  }

  @media (max-width: 600px) {
    .header { flex-direction: column; gap: 10px; text-align: center; }
    .header h1 { font-size: 1rem; }
    .game-content { padding: 25px 20px; }
    .question-text { font-size: 0.95rem; }
    .option-btn { font-size: 0.88rem; padding: 14px 16px; }
    .card-actions { justify-content: center; flex-wrap: wrap; }
    .stats-row { gap: 10px; }
    .stat-box { padding: 10px 15px; min-width: 120px; }
    .stat-box .stat-value { font-size: 1.4rem; }
    .leaderboard-table th, .leaderboard-table td {
      padding: 10px 8px;
      font-size: 0.85rem;
    }
  }
</style>
</head>

<div class="game-container">

<script>

  const API_URL = 'https://script.google.com/macros/s/AKfycbzxXdc2f_gu58xfsCvXRzKVA0ffvsmUJXhBfRMGlhXLWHeninBjG_lVDRZJvZhxn3V6Mg/exec';

  // Tiempo por pregunta (en segundos)
  const SECONDS_PER_QUESTION = 30;

  // Fecha de cierre: 29 de septiembre, 6:30 AM hora del centro de México
  // 6:30 AM CDMX = 12:30 UTC (México ya no usa horario de verano desde 2022)

  // ============================================================
  // BANCO DE 90 PREGUNTAS (15 por tema)

  const questionBank = [
    // ===== TOPIC 1: EPIC & EPOPEE (15) =====
    { topic: "Epic & Epopee", q: "What does the word \"epic\" literally mean?", options: ["Narrated word", "Long poem", "Heroic song"], correct: 0 },
    { topic: "Epic & Epopee", q: "Why is the epic considered the foundation of all literature in the world?", options: ["Because it was the first genre written down", "Because it was transmitted orally across generations and exalted ancestral values", "Because it was invented by the Greeks"], correct: 1 },
    { topic: "Epic & Epopee", q: "Which of the following is NOT a characteristic of epic poems?", options: ["Mixing legends with history", "Invocation of a muse", "Use of colloquial and everyday language"], correct: 2 },
    { topic: "Epic & Epopee", q: "What is the precise function of an epithet in epic poetry?", options: ["To replace the character's name entirely", "To magnify or enhance a characteristic of a noun, even if not strictly necessary", "To introduce the intervention of the gods"], correct: 1 },
    { topic: "Epic & Epopee", q: "What is the key difference between \"story\" and \"theme\" in a literary text?", options: ["Story is the abstract message; theme is the chronological sequence of events", "Story is the chronological sequence of actions; theme is the repeated abstract meaning", "Story refers only to myths; theme refers only to historical facts"], correct: 1 },
    { topic: "Epic & Epopee", q: "In the Epic of Gilgamesh, what specific event causes Gilgamesh to begin his search for immortality?", options: ["The gods send Enkidu to humble him", "The goddess Ishtar declares her desire for him", "The death of Enkidu after the gods are offended by Ishtar's dishonor"], correct: 2 },
    { topic: "Epic & Epopee", q: "What is the main emphasis of Chinese literature compared to Western literature?", options: ["The search for Truth", "The practice of Virtue", "The exaltation of war heroes"], correct: 1 },
    { topic: "Epic & Epopee", q: "Which correctly describes the Mahabharata?", options: ["It has 24,000 stanzas and tells the story of Rama", "It has more than 200,000 verses and tells the struggle for the throne of Hastinapura", "It was written by Valmiki and tells the story of a kidnapped queen"], correct: 1 },
    { topic: "Epic & Epopee", q: "In the Aeneid, what is the specific reason Aeneas must forsake Dido?", options: ["He no longer loves her", "The gods rule that he must descend into the underworld to behold Rome's future", "Dido betrays him with Turno"], correct: 1 },
    { topic: "Epic & Epopee", q: "What does Penelope represent in the Odyssey?", options: ["The encounter with oneself", "Fidelity and hope", "The wrath of the gods"], correct: 1 },
    { topic: "Epic & Epopee", q: "What is the key difference between the Iliad and the Odyssey?", options: ["The Iliad is about the Trojan War; the Odyssey is about the return home", "The Iliad is Latin; the Odyssey is Greek", "The Iliad has 24,000 verses; the Odyssey has 15,000"], correct: 0 },
    { topic: "Epic & Epopee", q: "Which epic is known as the longest poem in the world, and how many verses does it have?", options: ["The Mahabharata, more than 200,000 verses", "The Ramayana, more than 24,000 stanzas", "The Iliad, more than 15,000 verses"], correct: 0 },
    { topic: "Epic & Epopee", q: "What does the Book of the Dead contain, and what was its purpose?", options: ["Egyptian prayers to guide the deceased through the afterlife", "Mesopotamian laws for governing the people", "Greek myths about the gods of Olympus"], correct: 0 },
    { topic: "Epic & Epopee", q: "In the Ramayana, who kidnaps Sita, and how does Rama rescue her?", options: ["Ravana kidnaps her; Rama rescues her with an army of monkeys", "Turno kidnaps her; Aeneas rescues her with the help of the gods", "Hector kidnaps her; Achilles rescues her with the help of Patroclus"], correct: 0 },
    { topic: "Epic & Epopee", q: "What is the specific role of the gods in epic poetry?", options: ["They are absent from the narrative", "They appear and live with humans, intervening in their affairs", "They only appear in the introduction"], correct: 1 },

    // ===== TOPIC 2: MEDIEVAL SONGS (15) =====
    { topic: "Medieval Songs", q: "What specific consequence did the fragmentation of the Roman Empire have on literature?", options: ["The disappearance of oral tradition", "The proliferation of epic, written and oral, exalting heroes", "The exclusive use of Latin in all texts"], correct: 1 },
    { topic: "Medieval Songs", q: "What was the specific role of fiefs in the Middle Ages?", options: ["Tracts of land granted to those who offered vassalage, where peasants gave their lands in exchange for protection", "Independent kingdoms ruled by elected kings", "Religious territories controlled by the Church"], correct: 0 },
    { topic: "Medieval Songs", q: "Why were the Chansons de geste composed in Romance languages instead of Latin?", options: ["Because Latin was forbidden by the kings", "Because the common people had stopped speaking Latin by the 10th century", "Because Romance languages were easier to rhyme"], correct: 1 },
    { topic: "Medieval Songs", q: "What specific historical event inspired the Song of Roland, and when did it occur?", options: ["The Battle of Roncevaux Pass on August 15, 778", "The Crusades in 1095", "The fall of Constantinople in 1453"], correct: 0 },
    { topic: "Medieval Songs", q: "What is the central theme of the Song of Mio Cid?", options: ["The progressive aggrandizement of an unjustly banished hero who regains his honor", "The revenge of a knight against his king", "The love story between a knight and a princess"], correct: 0 },

    { topic: "Renaissance", q: "What specific change did Shakespeare introduce to pre-Renaissance drama?", options: ["He eliminated the chorus", "He updated the simplistic, two-dimensional writing style to create characters with psychological complexity", "He wrote only in Latin"], correct: 1 },
    { topic: "Renaissance", q: "Which of the following is NOT mentioned as a theme in Shakespeare's works?", options: ["Love and hate", "Ambition and jealousy", "Science and technology"], correct: 2 },

  function shuffle(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function selectQuestions() {
    const topics = [
      "Epic & Epopee",
      "Medieval Songs",
      "Renaissance",
      "Spanish Golden Age",
      "Romanticism, Realism & Naturalism",
      "North American Literature"
    ];
    const selected = [];

    topics.forEach(topic => {
      const topicQuestions = questionBank.filter(q => q.topic === topic);
      const randomQ = topicQuestions[Math.floor(Math.random() * topicQuestions.length)];
      selected.push(randomQ);
    });

    const remaining = questionBank.filter(q => !selected.includes(q));
    const shuffledRemaining = shuffle(remaining);
    for (let i = 0; i < 4; i++) {
      selected.push(shuffledRemaining[i]);
    }

    return shuffle(selected).map(q => shuffleOptions(q));
  }

  function shuffleOptions(question) {
    const shuffled = shuffle(question.options.map((text, i) => ({
      text: text,
      isCorrect: i === question.correct
    })));

    const newCorrectIndex = shuffled.findIndex(opt => opt.isCorrect);

    return {
      topic: question.topic,
      q: question.q,
      options: shuffled.map(opt => opt.text),
      correct: newCorrectIndex
    };
  }

  function updateScoreboard() {
    scoreDisplay.textContent = `Score: ${score}`;
    cardDisplay.textContent = `Q: ${currentQuestion}/${selectedQuestions.length}`;
    progressFill.style.width = `${(currentQuestion / selectedQuestions.length) * 100}%`;
  }

  function validateAndStart() {
    const emailInput = document.getElementById('emailInput');
    const usernameInput = document.getElementById('usernameInput');
    const emailError = document.getElementById('emailError');
    const usernameError = document.getElementById('usernameError');

    const email = emailInput.value.trim().toLowerCase();
    const username = usernameInput.value.trim();

    let valid = true;

    if (!email.endsWith('@tecmilenio.mx') || email.length < 20) {
      emailInput.classList.add('error');
      emailError.classList.add('visible');
      valid = false;
    } else {
      emailInput.classList.remove('error');
      emailError.classList.remove('visible');
    }

    if (username.length < 3 || username.length > 20) {
      usernameInput.classList.add('error');
      usernameError.classList.add('visible');
      valid = false;
    } else {
      usernameInput.classList.remove('error');
      usernameError.classList.remove('visible');
    }

    if (!valid) return;

    studentEmail = email;
    studentUsername = username;

    localStorage.setItem('guw_username', username);
    localStorage.setItem('guw_email', email);

    startGame();
  }

  // ============================================================
  // JUEGO
  // ============================================================
  function startGame() {
    // Verificar cierre de nuevo (por si acaso)
    if (isChallengeClosed()) {
      showClosedScreen();
      return;
    }

    selectedQuestions = selectQuestions();
    currentQuestion = 0;
    score = 0;
    topicErrors = {};
    updateScoreboard();
    showQuestion();
  }

  function showQuestion() {
    // Limpiar cualquier temporizador previo
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    if (currentQuestion >= selectedQuestions.length) {
      showEndScreen();
      return;
    }

    answered = false;
    timeLeft = SECONDS_PER_QUESTION;
    const q = selectedQuestions[currentQuestion];

    gameContent.innerHTML = `
      <div class="question-screen">
        <div class="question-header">
          <div class="question-counter">Question ${currentQuestion + 1} of ${selectedQuestions.length}</div>
          <div class="timer" id="timerDisplay">⏱️ ${timeLeft}s</div>
        </div>
        <div class="topic-tag">${q.topic}</div>
        <div class="question-box">
          <div class="question-text">${q.q}</div>
        </div>
        <div class="options-list" id="optionsList">
          ${q.options.map((opt, i) => `
            <button class="option-btn" onclick="selectOption(${i})" data-index="${i}">
              <span class="option-letter">${String.fromCharCode(65 + i)}</span>
              <span>${opt}</span>
            </button>
          `).join('')}
        </div>
        <div id="feedbackArea"></div>
      </div>
    `;

    updateScoreboard();
    startTimer();
  }

  function startTimer() {
    const timerDisplay = document.getElementById('timerDisplay');

    timerInterval = setInterval(() => {
      timeLeft--;
      if (timerDisplay) {
        timerDisplay.textContent = `⏱️ ${timeLeft}s`;

        // Cambiar color según el tiempo restante
        timerDisplay.classList.remove('warning', 'danger');
        if (timeLeft <= 5) {
          timerDisplay.classList.add('danger');
        } else if (timeLeft <= 10) {
          timerDisplay.classList.add('warning');
        }
      }

      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        timerInterval = null;
        handleTimeout();
      }
    }, 1000);
  }

  function handleTimeout() {
    if (answered) return;
    answered = true;

    const q = selectedQuestions[currentQuestion];
    const options = document.querySelectorAll('.option-btn');
    const feedbackArea = document.getElementById('feedbackArea');

    // Marcar la correcta en verde, no marcar incorrecta (porque nadie eligió)
    options.forEach((btn, i) => {
      btn.disabled = true;
      if (i === q.correct) {
        btn.classList.add('correct');
      }
    });

    // Registrar error por tema
    topicErrors[q.topic] = (topicErrors[q.topic] || 0) + 1;

    feedbackArea.innerHTML = `
      <div class="feedback timeout">
        ⏰ Time's up! The correct answer was: <strong>${q.options[q.correct]}</strong>
      </div>
    `;

    updateScoreboard();

    const actions = document.createElement('div');
    actions.className = 'card-actions';
    actions.innerHTML = `
      <button class="btn" onclick="nextQuestion()">
        ${currentQuestion === selectedQuestions.length - 1 ? 'See Results' : 'Next Question →'}
      </button>
    `;
    gameContent.querySelector('.question-screen').appendChild(actions);
  }

  function selectOption(index) {
    if (answered) return;
    answered = true;

    // Detener el temporizador
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    const q = selectedQuestions[currentQuestion];
    const options = document.querySelectorAll('.option-btn');
    const feedbackArea = document.getElementById('feedbackArea');

    options.forEach((btn, i) => {
      btn.disabled = true;
      if (i === q.correct) {
        btn.classList.add('correct');
      } else if (i === index) {
        btn.classList.add('incorrect');
      }
    });

    if (index === q.correct) {
      score += 10;
      feedbackArea.innerHTML = `<div class="feedback correct">✅ Correct! +10 points</div>`;
    } else {
      topicErrors[q.topic] = (topicErrors[q.topic] || 0) + 1;
      feedbackArea.innerHTML = `
        <div class="feedback incorrect">
          ❌ Not quite. The correct answer was: <strong>${q.options[q.correct]}</strong>
        </div>
      `;
    }

    updateScoreboard();

    const actions = document.createElement('div');
    actions.className = 'card-actions';
    actions.innerHTML = `
      <button class="btn" onclick="nextQuestion()">
        ${currentQuestion === selectedQuestions.length - 1 ? 'See Results' : 'Next Question →'}
      </button>
    `;
    gameContent.querySelector('.question-screen').appendChild(actions);
  }

  function nextQuestion() {
    currentQuestion++;
    updateScoreboard();
    showQuestion();
  }

        </div>

        <div style="margin-top: 20px;">
          <button class="btn-secondary" onclick="showLeaderboard()">🏆 View Leaderboard</button>
          <button class="btn" onclick="startGame()">Play Again</button>
        </div>

        <p style="margin-top: 20px; font-size: 0.9rem; color: #666;">
          Playing as <strong>${studentUsername}</strong> (${studentEmail})
        </p>
      </div>
    `;

    progressFill.style.width = '100%';

    submitScoreToSheetDB(score, newTotal);
  }

  async function submitScoreToSheetDB(attemptScore, totalScore) {
    const submissionBox = document.getElementById('submissionBox');

    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
  email: studentEmail,
  username: studentUsername,
  score: attemptScore,
  totalScore: totalScore
})
      });

      if (!response.ok) throw new Error('Network response was not ok');

      submissionBox.className = 'submission-box submitted';
      submissionBox.innerHTML = `
        <p>✅ Score submitted successfully! Check the leaderboard to see your rank.</p>
      `;

    } catch (error) {
      console.error('Error submitting score:', error);
      submissionBox.className = 'submission-box error';
      submissionBox.innerHTML = `
        <p>❌ Could not submit your score automatically. Please try again.</p>
        <button class="btn-secondary" onclick="retrySubmit()">🔄 Retry Submission</button>
      `;
    }
  }

  function retrySubmit() {
    const submissionBox = document.getElementById('submissionBox');
    submissionBox.className = 'submission-box';
    submissionBox.innerHTML = `<p>📤 Submitting your score...</p>`;

    const storageKey = `guw_score_${studentEmail}`;
    const newTotal = parseInt(localStorage.getItem(storageKey) || '0', 10);

    submitScoreToSheetDB(score, newTotal);
  }

  // ============================================================
  // RANKING
  // ============================================================
  async function showLeaderboard() {
    gameContent.innerHTML = `
      <div class="leaderboard-screen">
        <h2>🏆 Live Leaderboard</h2>
        <p>See how you rank against your classmates. Updated automatically.</p>
        <div id="leaderboardContent">
          <div class="leaderboard-loading">⏳ Loading leaderboard...</div>
        </div>
        <div style="margin-top: 20px;">
          <button class="btn" onclick="showIdentificationScreen()">← Back to Start</button>
        </div>
      </div>
    `;
    progressFill.style.width = '0%';

    await loadLeaderboardData();
  }

  async function loadLeaderboardData() {
    const leaderboardContent = document.getElementById('leaderboardContent');

    try {
      const response = await fetch(API_URL + '?t=' + Date.now());
      if (!response.ok) throw new Error('Network response was not ok');

      const responseJson = await response.json();
const data = responseJson.data;

      if (!data || data.length === 0) {
        leaderboardContent.innerHTML = `
          <div class="leaderboard-empty">
            <p style="font-size: 2rem; margin-bottom: 10px;">🎮</p>
            <p style="color: #004943; font-weight: 700; font-size: 1.1rem;">No scores yet!</p>
            <p style="color: #666; font-size: 0.95rem;">Be the first to play and claim the top spot.</p>
          </div>
        `;
        return;
      }

      const firstRow = data[0];
      const keys = Object.keys(firstRow);

      const emailKey = keys.find(k => k.toLowerCase().includes('email'));
      const usernameKey = keys.find(k => k.toLowerCase().includes('username'));
      const scoreKey = keys.find(k => k.toLowerCase().includes('score (this attempt)'));

      if (!emailKey || !usernameKey || !scoreKey) {
        throw new Error('Columnas no encontradas');
      }

      const userMap = new Map();

      data.forEach(row => {
        const email = (row[emailKey] || '').trim().toLowerCase();
        const username = (row[usernameKey] || '').trim();
        const scoreVal = parseInt(row[scoreKey], 10);

        if (!email || !username || isNaN(scoreVal)) return;

        if (!userMap.has(email)) {
          userMap.set(email, { username, totalScore: 0, attempts: 0 });
        }
        const user = userMap.get(email);
        user.totalScore += scoreVal;
        user.attempts += 1;
        user.username = username;
      });

      const leaderboard = Array.from(userMap.values())
        .sort((a, b) => b.totalScore - a.totalScore);

      if (leaderboard.length === 0) {
        leaderboardContent.innerHTML = `
          <div class="leaderboard-empty">
            <p style="font-size: 2rem; margin-bottom: 10px;">🎮</p>
            <p style="color: #004943; font-weight: 700; font-size: 1.1rem;">No scores yet!</p>
          </div>
        `;
        return;
      }

      let html = '<table class="leaderboard-table"><thead><tr>';
      html += '<th>Rank</th>';
      html += '<th>Username</th>';
      html += '<th>Total Score</th>';
      html += '</tr></thead><tbody>';

      leaderboard.forEach((entry, index) => {
        const rank = index + 1;
        let rankClass = '';
        let rankDisplay = rank;

        if (rank === 1) { rankClass = 'rank-1'; rankDisplay = '🥇'; }
        else if (rank === 2) { rankClass = 'rank-2'; rankDisplay = '🥈'; }
        else if (rank === 3) { rankClass = 'rank-3'; rankDisplay = '🥉'; }

        const attemptsBadge = entry.attempts > 1 ? `<span class="attempts-badge">${entry.attempts}×</span>` : '';

        html += `<tr class="${rankClass}">`;
        html += `<td class="rank-cell">${rankDisplay}</td>`;
        html += `<td class="username-cell">${escapeHtml(entry.username)}${attemptsBadge}</td>`;
        html += `<td class="score-cell">${entry.totalScore}</td>`;
        html += `</tr>`;
      });

      html += '</tbody></table>';
      leaderboardContent.innerHTML = html;

    } catch (error) {
      console.error('Error loading leaderboard:', error);
      leaderboardContent.innerHTML = `<div class="leaderboard-error">❌ Could not load leaderboard. Please try again later.</div>`;
    }
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // ============================================================
  // INIT
  // ============================================================
  // Verificar si el challenge está cerrado antes de mostrar nada
  if (isChallengeClosed()) {
    showClosedScreen();
  } else {
    showIdentificationScreen();
  }
</script>

</body>
</html>
